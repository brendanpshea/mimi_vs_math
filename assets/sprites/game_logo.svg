<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8B0" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#CC8800" />
    </linearGradient>
  </defs>
  
  <text x="300" y="120" font-family="'Fredoka', 'Nunito', Arial, sans-serif" font-size="90" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" stroke="#4A2500" stroke-width="12" paint-order="stroke fill" filter="url(#glow)">
    Mimi vs. Math
  </text>
  <text x="300" y="160" font-family="'Nunito', Arial, sans-serif" font-size="24" font-weight="bold" fill="#AADDFF" text-anchor="middle" stroke="#1A2A4A" stroke-width="4" paint-order="stroke fill">
    A Magical RPG Adventure
  </text>
  <!-- Cute cat ear decorations on the M's -->
  <path d="M110 70 L130 30 L150 70 Z" fill="#FF88CC" stroke="#4A2500" stroke-width="4" />
  <path d="M490 70 L470 30 L450 70 Z" fill="#FF88CC" stroke="#4A2500" stroke-width="4" />
</svg>
